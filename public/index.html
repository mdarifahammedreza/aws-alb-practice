<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ALB Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 2rem 2.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    min-width: 320px;
  }
  h1 {
    margin-top: 0;
    font-size: 1.4rem;
    color: #38bdf8;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  td {
    padding: 0.4rem 0;
    border-bottom: 1px solid #334155;
    font-size: 0.95rem;
  }
  td.key {
    color: #94a3b8;
    width: 45%;
  }
  td.val {
    font-weight: 600;
    word-break: break-all;
  }
  .refresh {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: #64748b;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Served by EC2 instance</h1>
    <table id="info"></table>
    <div class="refresh">auto-refreshing every 5s - reload behind an ALB to see it rotate</div>
  </div>

  <script>
    const labels = {
      instanceId: 'Instance ID',
      instanceType: 'Instance Type',
      availabilityZone: 'Availability Zone',
      privateIp: 'Private IP',
      publicIp: 'Public IP',
      hostname: 'Hostname',
      serverTime: 'Server Time',
    };

    async function load() {
      try {
        const res = await fetch('/api/info');
        const data = await res.json();
        const table = document.getElementById('info');
        table.innerHTML = Object.entries(labels)
          .map(([key, label]) => `
            <tr>
              <td class="key">${label}</td>
              <td class="val">${data[key] ?? 'N/A'}</td>
            </tr>
          `).join('');
      } catch (e) {
        document.getElementById('info').innerHTML = '<tr><td>Error loading data</td></tr>';
      }
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
